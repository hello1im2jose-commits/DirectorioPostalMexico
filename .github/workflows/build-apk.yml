name: Crear APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar paquetes Android
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -o DirectorioPostalMexico_APK_GitHub.zip -d proyecto

      - name: Preparar firma permanente
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p proyecto/DirectorioPostalMexico/app
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > proyecto/DirectorioPostalMexico/app/directorio-postal.jks

      - name: Compilar APK firmada
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p proyecto/DirectorioPostalMexico :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectorioPostalMexico-APK
          path: proyecto/DirectorioPostalMexico/app/build/outputs/apk/debug/app-debug.apk
          
